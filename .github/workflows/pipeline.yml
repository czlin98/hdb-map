name: pipeline

on:
  schedule:
    - cron: "0 0 1 * *" # 08:00 SGT on the 1st (Actions cron is UTC-only)
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install runtime deps
        working-directory: pipeline
        run: pip install -r requirements.txt
      - name: Run pipeline
        working-directory: pipeline
        env:
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
          PYTHONUNBUFFERED: "1" # stream per-block geocode logs live
        run: python src/run.py
      - name: Commit data if changed
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/public/data pipeline/failed_blocks.csv
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
          else
            # A manual dispatch is tagged so it stands apart from the monthly refresh.
            DATE=$(jq -r .data_accessed app/public/data/meta.json)
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              RUN_TYPE=manual
            else
              RUN_TYPE=monthly
            fi
            # meta.json changes on every run, so a commit touching nothing else is a check
            # that found the data unchanged.
            if git diff --cached --quiet -- . ':!app/public/data/meta.json'; then
              git commit -m "chore(data): $RUN_TYPE check, no data changes ($DATE)"
            else
              git commit -m "chore(data): $RUN_TYPE HDB data refresh ($DATE)"
            fi
            git push
          fi
