name: pipeline

on:
  schedule:
    - cron: "0 0 1 * *"   # 00:00 UTC = 08:00 SGT on the 1st of each month (Actions cron is UTC-only)
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install runtime deps
        working-directory: pipeline
        run: pip install -r requirements.txt
      - name: Run pipeline
        working-directory: pipeline
        env:
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
          PYTHONUNBUFFERED: "1"   # stream per-address geocode logs live
        run: python src/run.py
      - name: Commit data if changed
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/public/data pipeline/geocode_failures.csv
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
          else
            # SGT date labels the snapshot; a manual dispatch is tagged so it is
            # distinguishable from the scheduled monthly refresh in the log.
            DATE=$(TZ=Asia/Singapore date +%Y-%m-%d)
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              RUN_TYPE=manual
            else
              RUN_TYPE=monthly
            fi
            git commit -m "chore(data): $RUN_TYPE HDB data refresh ($DATE)"
            git push
          fi
